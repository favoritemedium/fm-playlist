services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* vars must be passed at build time so Next.js can inline them.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Standard libpq settings from the POSTGRES_* vars in .env (single source
      # of truth). They take precedence over any DATABASE_URL the host injects.
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-fmplaylist}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-fm_playlist}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fm_playlist}
      POSTGRES_USER: ${POSTGRES_USER:-fmplaylist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Uncomment to expose Postgres to the host for debugging:
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fmplaylist} -d ${POSTGRES_DB:-fm_playlist}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Idle helper for offsite backups. A scheduled task (e.g. Coolify cron) runs
  # `/backup/backup.sh` inside this container; see docs/DEPLOYMENT.md.
  backup:
    build: ./db/backup
    # Only what the script needs: no env_file, so Clerk and other app secrets
    # are not exposed to this container. Credentials go via libpq env vars.
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-fmplaylist}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-fm_playlist}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
